<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ss-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ss-scan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scanning Frame Corners -->
  <path d="M 22 36 V 24 C 22 22.895 22.895 22 24 22 H 36" stroke="url(#ss-grad-1)" stroke-width="5" stroke-linecap="round" />
  <path d="M 64 22 H 76 C 77.105 22 78 22.895 78 24 V 36" stroke="url(#ss-grad-1)" stroke-width="5" stroke-linecap="round" />
  <path d="M 78 64 V 76 C 78 77.105 77.105 78 76 78 H 64" stroke="url(#ss-grad-1)" stroke-width="5" stroke-linecap="round" />
  <path d="M 36 78 H 24 C 22.895 78 22 77.105 22 76 V 64" stroke="url(#ss-grad-1)" stroke-width="5" stroke-linecap="round" />

  <!-- Document Page -->
  <rect x="32" y="28" width="36" height="44" rx="4" fill="url(#ss-grad-1)" fill-opacity="0.12" stroke="url(#ss-grad-1)" stroke-width="2.5" />
  
  <!-- Document Text Lines -->
  <line x1="40" y1="37" x2="60" y2="37" stroke="url(#ss-grad-1)" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="45" x2="56" y2="45" stroke="url(#ss-grad-1)" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="53" x2="60" y2="53" stroke="url(#ss-grad-1)" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="61" x2="52" y2="61" stroke="url(#ss-grad-1)" stroke-width="3" stroke-linecap="round" />

  <!-- Horizontal Laser Scan Line with Glow -->
  <line x1="16" y1="50" x2="84" y2="50" stroke="url(#ss-scan-glow)" stroke-width="4" stroke-linecap="round" filter="url(#ss-glow)" />
  <circle cx="50" cy="50" r="3.5" fill="#f59e0b" filter="url(#ss-glow)" />
</svg>
