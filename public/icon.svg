<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Unique Snafasa Scan (S-Beam + Scanner Frame) -->
  
  <!-- Corner Scanner Brackets -->
  <path d="M 20 34 V 22 C 20 20.895 20.895 20 22 20 H 34" stroke="#00d8f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 66 20 H 78 C 79.105 20 80 20.895 80 22 V 34" stroke="#00d8f6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 80 66 V 78 C 80 79.105 79.105 80 78 80 H 66" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 34 80 H 22 C 20.895 80 20 79.105 20 78 V 66" stroke="#0284c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Soft Document Page Fill -->
  <rect x="28" y="26" width="44" height="48" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" />

  <!-- Document Line Accents -->
  <line x1="35" y1="34" x2="48" y2="34" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="35" y1="66" x2="65" y2="66" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Signature Stylized "S" Scan Beam -->
  <path d="M 63 38 C 63 33 41 33 39 44 C 37 55 63 51 61 62 C 59 72 37 69 37 69" 
        stroke="url(#snafasaGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Scanning Laser Ray -->
  <line x1="24" y1="50" x2="76" y2="50" stroke="#00d8f6" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />

  <defs>
    <linearGradient id="snafasaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
</svg>
